name: Daily Agentic AI Refresh

on:
  schedule:
    # Runs every day at 06:00 UTC (you'll see fresh content each morning)
    - cron: '0 6 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
  # Also rebuild on every push to main (so first deploy works immediately)
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment runs at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate today's content
        run: python scripts/generate.py

      - name: Show what was generated
        run: |
          echo "=== Generated file stats ==="
          wc -l index.html
          head -5 index.html

      - name: Commit updated index.html
        run: |
          git config user.name  "Agentic AI Daily Bot"
          git config user.email "bot@agentic-ai-daily.github"
          git add index.html
          # Only commit if there's a change (first run always has a change)
          git diff --staged --quiet || git commit -m "chore: daily refresh — $(date +'%Y-%m-%d')"
          git push

      - name: Upload to GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
